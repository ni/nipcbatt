name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

env:
  POETRY_VERSION: 1.8.4
  ARCHITECTURE: 'x64'
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: shared-windows-runner
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          architecture: ${{ env.ARCHITECTURE }}
          python-version: ${{ matrix.python-version }}

      - name: Check Windows architecture
        shell: powershell
        run: |
          Write-Host "OS Architecture: $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install Dependencies
        run: |
          poetry install -vvv
          poetry run pip install pip-audit pytest pytest-html

      - name: Security Scan - pip-audit
        continue-on-error: true
        shell: powershell
        run: |
          poetry run pip-audit `
            --format json `
            --output pip-audit-report.json

          poetry run pip-audit

      - name: Upload pip-audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-py${{ matrix.python-version }}
          path: pip-audit-report.json
          if-no-files-found: ignore

      - name: Lint the Code
        continue-on-error: true
        shell: powershell
        run: |
          poetry run python -m pip show ni-python-styleguide

          if ($LASTEXITCODE -eq 0) {
              poetry run ni-python-styleguide lint
          }
          else {
              Write-Host "ni-python-styleguide not installed. Skipping lint."
          }

      - name: Create report directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports
          New-Item -ItemType Directory -Force -Path junit

      - name: Run Unit Tests
        shell: powershell
        run: |
          poetry run pytest `
            --verbose `
            --doctest-modules `
            --html=reports/pytest-report-${{ matrix.python-version }}.html `
            --self-contained-html `
            --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report-${{ matrix.python-version }}
          path: reports/pytest-report-${{ matrix.python-version }}.html
          if-no-files-found: ignore

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-py${{ matrix.python-version }}
          path: reports
          if-no-files-found: ignore

      - name: Build Python package
        run: poetry build

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: |
            dist
            !dist/**/*.md